<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craque do Quiz | Resultado</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/common.js" defer></script>
  <script src="../js/resultado.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-ball">⚽</span><span>Craque <strong>do Quiz</strong></span></a><nav class="main-nav" aria-label="Navegação principal"><a href="index.html">Início</a><a href="ranking.html">Ranking</a><a href="sobre.html">Sobre</a></nav></header>
  <main class="container result-main">
    <section class="result-card">
      <div class="result-trophy">🏆</div>
      <span class="eyebrow">Fim de jogo</span>
      <h1 id="result-title">Seu resultado</h1>
      <p class="result-message" id="result-message">Confira como foi sua partida.</p>
      <div class="score-number"><strong id="score-value">0</strong><span>pontos</span></div>
      <div class="result-stats"><div><strong id="correct-value">0</strong><span>Acertos</span></div><div><strong id="wrong-value">0</strong><span>Erros</span></div><div><strong id="accuracy-value">0%</strong><span>Precisão</span></div></div>
      <p class="result-detail" id="result-detail"></p>
      <div class="result-actions"><a class="btn btn-primary" href="index.html">Jogar novamente <span>→</span></a><a class="btn btn-secondary" href="ranking.html">Ver ranking</a></div>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><span>⚽ Craque do Quiz</span><span>Uma partida de cada vez.</span></div></footer>
</body>
</html>
